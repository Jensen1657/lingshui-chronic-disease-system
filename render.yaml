# Render 部署配置 - 仅后端
# 前端部署到 Netlify: https://app.netlify.com/start

databases:
  - name: slow-disease-db
    plan: free
    databaseName: slow_disease
    ipAllowList: []

services:
  - type: web
    name: lingshui-chronic-api
    plan: free
    region: singapore
    repo: https://github.com/Jensen1657/lingshui-chronic-disease-system
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head 2>/dev/null || true
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: slow-disease-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: ENVIRONMENT
        value: "production"
      - key: LOG_LEVEL
        value: "INFO"
      - key: REDIS_URL
        value: ""
      - key: CORS_ORIGINS
        value: "https://lingshui-chronic.netlify.app,http://localhost:3000"
