# Render 部署配置 - 陵水县人民医院慢病管理系统
# 文档: https://render.com/docs/deploying-static-sites

databases:
  - name: slow-disease-db
    plan: free
    databaseName: slow_disease
    ipAllowList: []

services:
  # 后端 Web Service
  - type: web
    name: slow-disease-api
    plan: free
    region: singapore
    repo: https://github.com/Jensen1657/lingshui-chronic-disease-system
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head 2>/dev/null || true
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: slow-disease-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: ENVIRONMENT
        value: "production"
      - key: LOG_LEVEL
        value: "INFO"
      - key: REDIS_URL
        value: ""
      - key: CORS_ORIGINS
        value: "https://slow-disease.netlify.app,http://localhost:3000"

  # 前端 Static Site
  - type: web
    name: slow-disease-web
    plan: free
    region: singapore
    repo: https://github.com/Jensen1657/lingshui-chronic-disease-system
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://slow-disease-api.onrender.com"
